version: "3.8"

services:
  tenant:
    build:
      context: .
      dockerfile: apps/tenant/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - DATABASE_URL=file:/data/leasing.db
    volumes:
      - ./data:/data

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - DATABASE_URL=file:/data/leasing.db
    volumes:
      - ./data:/data

  wecom:
    build:
      context: .
      dockerfile: apps/wecom/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=file:/data/leasing.db
    volumes:
      - ./data:/data
